spring:
  application:
    name: config-server
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          # Configuration is read from the GitHub repository, not the classpath.
          # The property files live under configserver/src/main/resources/config in that repo.
          uri: https://github.com/sanjaychaudhuri/license-server-ch5.git
          search-paths: configserver/src/main/resources/config
          default-label: main
          clone-on-start: true
        # Previous classpath backend, kept for reference:
        #native:
        #  search-locations: classpath:/config

server:
  port: 8071

encrypt:
  key: fje83Ki8403Iod87dne7Yjsl3THueh48jfuO9j4U2hf64Lo


#Enable all Spring Boot Actuator endpoints.
management:
  endpoints:
    web:
      exposure:
        include: "*"
